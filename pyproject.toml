[project]
name = "formation-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicola_UB24", email = "nico.decarli@live.it" }
]
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "networkx",
    "numpy>=1.22",
    "osqp",
    "qpsolvers",
    "scipy>=1.11",
]
[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]