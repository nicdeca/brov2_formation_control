[project]
name = "formation-control"
version = "0.1.0"
description = "Code for vision-based underwater formation control with input saturations via barrier Lyapunov functions."
readme = "README.md"
authors = [
    { name = "Nicola De Carli", email = "nico.decarli@live.it" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "osqp>=1.1.3",
    "qpsolvers>=4.13.0",
    "scipy>=1.18.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
